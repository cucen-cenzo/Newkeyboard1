name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip the project parts
        run: |
          mkdir project
          for f in parts/*.zip; do unzip -oq "$f" -d project; done

      - name: Fetch the parts the zip leaves out
        working-directory: project/android-keyboard-0.1.30
        run: |
          git lfs install
          get() { rm -rf "$2"; git clone --depth 1 "$1" "$2"; }
          get https://gitlab.futo.org/keyboard/android-libs.git libs
          get https://github.com/futo-org/futo-keyboard-layouts.git java/assets/layouts
          get https://gitlab.futo.org/keyboard/seasonal-themes.git java/assets/themes
          get https://gitlab.futo.org/keyboard/keyboard-translations-public.git translations
          get https://gitlab.futo.org/keyboard/keyboard-large-resources.git java/res-large
          get https://gitlab.futo.org/keyboard/voice-input-models.git voiceinput-shared/src/main/ml || echo "voice models skipped"
          get https://huggingface.co/futo-org/futo-swipe java/assets/futo-swipe || echo "swipe model skipped"
          ls libs

      - name: Install the Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"

      - name: Build
        working-directory: project/android-keyboard-0.1.30
        env:
          VERSION_CODE: "1"
          VERSION_NAME: "godfather"
        run: |
          chmod +x gradlew
          ./gradlew assembleUnstableDebug --no-daemon --stacktrace

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: project/**/build/outputs/apk/**/*.apk
