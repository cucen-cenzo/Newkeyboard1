name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip the project parts
        run: |
          mkdir project
          for f in parts/*.zip; do unzip -oq "$f" -d project; done

      - name: Install the Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"

      - name: Build
        working-directory: project/android-keyboard-0.1.30
        env:
          VERSION_CODE: "1"
          VERSION_NAME: "godfather"
        run: |
          chmod +x gradlew
          ./gradlew assembleUnstableDebug --no-daemon --stacktrace

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: project/**/build/outputs/apk/**/*.apk
